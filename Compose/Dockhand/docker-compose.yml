services:
  dockhand:
    container_name: dockhand
    image: fnsys/dockhand:latest
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    ports:
      - "3000:3000"

    volumes:
      # Docker socket so Dockhand can manage containers
      - /var/run/docker.sock:/var/run/docker.sock

      # Persistent data
      - ${APPDATA_ROOT}/dockhand:/data

      # Compose Stacks 
      - "/mnt/user/ComputerSyncs/MacBook Backup/Configuration/Github/Docker-Containers:/stacks"

    networks:
      - SchmidtHouse

    labels:
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/selfhst/icons/main/png/dockhand.png"

networks:
  SchmidtHouse:
    external: true
