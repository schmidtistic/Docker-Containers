services:
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    hostname: ${HOST_HOSTNAME}
    restart: unless-stopped
    pid: host

    ports:
      - "19999:19999"

    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN

    security_opt:
      - apparmor:unconfined

    environment:
      TZ: ${TZ}

    volumes:
      - ${APPDATA_ROOT}/netdata/config:/etc/netdata
      - ${APPDATA_ROOT}/netdata/lib:/var/lib/netdata
      - ${APPDATA_ROOT}/netdata/cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - SchmidtHouse

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netdata.rule=Host(`netdata.schmidtworx.com`)"
      - "traefik.http.routers.netdata.entrypoints=web"
      - "traefik.http.services.netdata.loadbalancer.server.port=19999"

networks:
  SchmidtHouse:
    external: true
